    <text x="24" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">Material: PETG, strat 0.20 mm, 3 pere?i, 25% infill. Baza cu podeaua pe pat; capacul cu buza pe pat.</text>

    <rect x="24" y="124" width="22" height="14" fill="#2f7a38"/>
    <text x="54" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">Raspberry Pi 4  (85 × 56 mm)</text>
