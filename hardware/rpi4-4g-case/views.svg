  <text x="40" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#444">hardware/rpi4-4g-case/rpi4_4g_hat_case.scad  ·  gabarit corp ~108 × 79 × 36 mm</text>

