    <text x="54" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">Corp PETG  ~108 × 79 × 36 mm f?r? antene</text>

    <text x="460" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">SMA: D-hole Ø6.55 mm, flat 6.05 mm</text>
    <text x="460" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">?uruburi: 4× M2.5 (pl?ci) + 4× M3 (capac)</text>
